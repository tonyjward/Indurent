[project]
name = "indurent-matching"
version = "0.1.0"
description = "Match marketed warehouse listings to the existing Indurent estate (vectorisation + RAG + LLM)."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "ruff>=0.17.5",
]
