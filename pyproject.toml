[project]
name = "indurent-matching"
version = "0.1.0"
description = "Match marketed warehouse listings to the existing Indurent estate (vectorisation + RAG + LLM)."
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langgraph-cli[inmem]>=0.4.43",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indurent_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
